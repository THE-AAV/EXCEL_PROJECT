# One-click hosting on Render (https://render.com): New > Blueprint > pick this repository.
# It creates the web app and its PostgreSQL database. Render asks for ADMIN_PASSWORD once; sign in with
# user "admin" and that password. Step-by-step instructions are in the README ("Put it online").
services:
  - type: web
    name: business-reports
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-reports-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: business-reports-db
    plan: basic-256mb
    region: singapore
    databaseName: business
    user: business
