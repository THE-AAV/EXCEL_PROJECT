name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-server.txt pytest httpx
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Backend tests (PostgreSQL)
        run: python -m pytest -q tests/test_server.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # the built pages are kept in the repository so the office computer needs no Node.js
      - name: Built pages are up to date (run "npm run build" in web/ and commit web/dist)
        run: git add -N web/dist && git diff --exit-code --stat -- web/dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t business-reports .
