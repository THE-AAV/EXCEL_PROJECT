# One command runs everything:   docker compose up -d --build
# then open http://<server>:8000 and create the admin account.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: business
      POSTGRES_USER: business
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d business"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://business:${POSTGRES_PASSWORD}@db:5432/business
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
    volumes:
      - appdata:/data          # uploaded workbooks
    ports:
      - "8000:8000"

volumes:
  pgdata:
  appdata:
